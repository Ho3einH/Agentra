services:
  ollama:
    image: ollama/ollama
    container_name: customer-agent-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  agent:
    build: .
    container_name: customer-agent-api
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      OLLAMA_URL: http://ollama:11434
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      ollama:
        condition: service_healthy

  telegram-bot:
    build: .
    container_name: customer-agent-telegram
    restart: unless-stopped
    env_file: .env
    environment:
      AGENT_URL: http://agent:8000/message
    depends_on:
      - agent

  ui:
    build: .
    container_name: customer-agent-ui
    restart: unless-stopped
    command: streamlit run ui.py --server.address 0.0.0.0 --server.port 8501
    environment:
      AGENT_URL: http://agent:8000/message
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      - agent

volumes:
  ollama_data:
